[project]
name = "searxng"
description = "SearXNG is a metasearch engine. Users are neither tracked nor profiled."
readme = "README.rst"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "babel==2.18.0",
    "certifi==2026.10.23",
    "curl_cffi==0.17.0",
    "fastapi==0.162.0",
    "flask-babel==4.0.0",
    "flask==3.1.3",
    "isodate==0.7.2",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "markdown-it-py==4.3.0",
    "msgspec==0.22.0",
    "pydantic==2.14.2",
    "pygments==2.21.0",
    "python-dateutil==3.0.0",
    "pyyaml==6.0.3",
    "scalar-fastapi>=1.10.0",
    "typer==0.29.1",
    "typing-extensions==4.16.0",
    "uvicorn==0.54.0",
    "valkey==6.1.1",
    "whitenoise==6.12.0",
]

[project.optional-dependencies]
dev = [
    "aiounittest==1.5.0",
    "basedpyright==1.40.2",
    "black==26.10.1",
    "coloredlogs==15.0.1",
    "cov-core==1.15.0",
    "docutils>=0.21.2; python_version <= '3.11'",
    "docutils>=0.22.4; python_version > '3.11'",
    "furo==2025.12.19",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "linuxdoc==20260504",
    "mock==5.2.0",
    "myst-parser==5.0.0",
    "nose2[coverage_plugin]==0.16.0",
    "parameterized==0.9.0",
    "pylint==4.1.4",
    "selenium==4.52.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-issues==6.0.0",
    "sphinx-jinja==2.0.2",
    "sphinx-notfound-page==1.1.0",
    "sphinx-tabs==3.5.0",
    "Sphinx==8.2.3; python_version <= '3.11'",
    "Sphinx==9.1.0; python_version > '3.11'",
    "sphinxcontrib-programoutput==0.20",
    "splinter==0.21.0",
    "types-lxml==2026.2.16",
    "wlc==3.3.0",
    "yamllint==1.38.0"
]
server=[
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0"
]

[project.urls]
Repository = "https://github.com/searxng/searxng"
Documentation = "https://docs.searxng.org/"

[tool.uv.extra-build-dependencies]
searxng = ["msgspec", "pyyaml", "typing_extensions"]

[tools.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.black]
# project specifics
target-version = ["py311"]
include = 'searxng.msg|\.pyi?$'
extend-exclude = '''
/(
    searx/static
  | searx/languages\.py
)/
'''
# formatting specifics
line-length = 120
skip-string-normalization = true

[tool.coverage.run]
branch = true
source = ["searx"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:"]

[tool.coverage.html]
directory = "coverage"

[tool.pylint]
# ref https://pylint.pycqa.org/en/stable/user_guide/configuration/all-options.html

[tool.pylint.main]
extension-pkg-whitelist = ["lxml.etree"]
ignore = ["CVS", ".git", ".svn"]

[tool.pylint.basic]
argument-rgx = "(([a-z][a-zA-Z0-9_]{2,30})|(_[a-z0-9_]*))$"
attr-rgx = "(([a-z][a-z0-9_]{2,30})|(_[a-z0-9_]*)|([A-Z0-9_]*))$"
class-attribute-rgx = "([A-Za-z_][A-Za-z0-9_]{2,30}|(__.*__))$"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
const-rgx = "(([a-zA-Z_][a-zA-Z0-9_]*)|(__.*__))$"
function-rgx = "(([a-z][a-zA-Z0-9_]{2,30})|(_[a-z0-9_]*))$"
good-names = ["i", "j", "k", "ex", "Run", "_", "log", "cfg", "id"]
inlinevar-rgx = "[A-Za-z_][A-Za-z0-9_]*$"
method-rgx = "(([a-z][a-zA-Z0-9_]{2,30})|(_[a-z0-9_]*))$"
module-rgx = "([a-z_][a-z0-9_]*)$"
variable-rgx = "([a-zA-Z0-9_]*)$"

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp"]
exclude-protected = ["_asdict", "_fields", "_replace", "_source", "_make"]

[tool.pylint.design]
max-args = 8
max-attributes = 20
max-locals = 20
max-positional-arguments = 14

[tool.pylint.exceptions]
overgeneral-exceptions = ["builtins.Exception"]

[tool.pylint.format]
max-line-length = 120
max-module-lines = 2000

[tool.pylint.imports]
deprecated-modules = ["optparse", "tkinter.tix"]

[tool.pylint."messages control"]
disable = ["raw-checker-failed", "bad-inline-option", "locally-disabled", "file-ignored", "suppressed-message", "useless-suppression", "deprecated-pragma", "use-symbolic-message-instead", "use-implicit-booleaness-not-comparison-to-string", "use-implicit-booleaness-not-comparison-to-zero", "duplicate-code", "missing-function-docstring", "consider-using-f-string"]

[tool.pylint.reports]
evaluation = "10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10)"

[tool.pylint.typecheck]
ignored-classes = ["optparse.Values", "thread._local", "_thread._local"]

[tool.pylint.variables]
init-import = true
redefining-builtins-modules = ["six.moves", "future.builtins"]

[tool.pyright]
venvPath = "local"
venv = "py3"
include = ["backend","searx","searxng_extra","tests"]

reportAny = false
reportConstantRedefinition = false
reportExplicitAny = false
reportIgnoreCommentWithoutRule = "information"
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportImportCycles = "warning"
reportMissingTypeStubs = "information"
reportUninitializedInstanceVariable = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "information"
reportUnusedCallResult = false

enableTypeIgnoreComments = true
executionEnvironments = [{root = "searx", extraPaths = ["."] },
                         {root = "searxng_extra", extraPaths = ["."], reportAny = false, reportUnknownMemberType = false, reportUnknownVariableType = false},
                         {root = "tests", extraPaths = ["."], reportAny = false, reportImplicitOverride = false, reportMissingParameterType = false, reportMissingTypeArgument = false, reportMissingTypeStubs = false, reportPrivateLocalImportUsage = false, reportPrivateUsage = false, reportUnannotatedClassAttribute = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportUnknownMemberType = false, reportUnknownParameterType = false, reportUnknownVariableType = false, reportUnusedParameter = false}]
