---
name: Documentation

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # fail if pyproject.toml and uv.lock are out of sync
  UV_LOCKED: "1"

jobs:
  release:
    if: github.repository_owner == 'searxng' || github.event_name == 'workflow_dispatch'
    name: Release
    runs-on: ubuntu-26.04-arm
    permissions:
      # for JamesIves/github-pages-deploy-action to push
      contents: write

    steps:
      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@e3e7c1eacb980339352a5ad69affcd3b6c206c92  # v0.13.10
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: "false"
          fetch-depth: "0"

      - name: Setup dependencies
        run: sudo ./utils/searxng.sh install buildhost

      - name: Setup venv
        run: make V=1 install

      - name: Build documentation
        run: make V=1 docs.html

      - if: github.ref_name == 'master'
        name: Release
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          folder: "dist/docs"
          branch: "gh-pages"
          commit-message: "[mod] docs: build from commit ${{ github.sha }}"
          # Automatically remove deleted files from the deploy branch
          clean: "true"
          single-commit: "true"
