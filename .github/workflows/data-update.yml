---
name: Update searx.data

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "59 23 28 * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # fail if pyproject.toml and uv.lock are out of sync
  UV_LOCKED: "1"

jobs:
  data:
    if: github.repository_owner == 'searxng'
    name: ${{ matrix.fetch }}
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        fetch:
          - update_ahmia_blacklist.py
          - update_currencies.py
          - update_external_bangs.py
          - update_firefox_version.py
          - update_engine_traits.py
          - update_wikidata.py
          - update_engine_descriptions.py

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@e3e7c1eacb980339352a5ad69affcd3b6c206c92  # v0.13.10
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup venv
        run: make V=1 install

      - name: Fetch data
        env:
          SEARXNG_CONTACT_URL: "${{ secrets.CONTACT_EMAIL }}"
        run: V=1 ./manage pyenv.cmd python "./searxng_extra/update/${{ matrix.fetch }}"

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          author: "searxng-bot <searxng-bot@users.noreply.github.com>"
          committer: "searxng-bot <searxng-bot@users.noreply.github.com>"
          title: "[mod] data: update searx.data - ${{ matrix.fetch }}"
          commit-message: "[mod] data: update searx.data - ${{ matrix.fetch }}"
          branch: "ci-data-${{ matrix.fetch }}"
          delete-branch: "true"
          draft: "false"
          signoff: "false"
          body: |
            Update searx.data - ${{ matrix.fetch }}
          labels: |
            data
